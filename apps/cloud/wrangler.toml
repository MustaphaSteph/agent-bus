name = "agent-bus-cloud"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public", "enable_request_signal", "request_signal_passthrough"]

# Dedicated storage for OAuth clients, grants, and tokens.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "01b63a97f4e8466f9227cba597764006"

[assets]
directory = "./public"

[[r2_buckets]]
binding = "CHAT_FILES"
bucket_name = "agent-bus-cloud-chat-files"

[[durable_objects.bindings]]
name = "WORKSPACE_BUS"
class_name = "WorkspaceBusObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceBusObject"]

[[d1_databases]]
binding = "AGENT_BUS_CLOUD_DB"
database_name = "agent-bus-cloud"
database_id = "7a67bae1-f53e-4efa-a56f-fd0eb81acb97"
migrations_dir = "migrations/d1"

[vars]
AGENT_BUS_CLOUD_ENV = "production"
AUTH_PUBLIC_ORIGIN = "https://agent-bus-cloud.mustapha-achtaou.workers.dev"
AUTH_SIGNUP_ENABLED = "true"
# Set AGENT_BUS_CLOUD_AUTH_SECRET with `wrangler secret put` in production.
# Social sign-in is shown only after its CLIENT_ID and CLIENT_SECRET bindings exist.
# Store Google/GitHub client secrets with `wrangler secret put`, never in this file.
